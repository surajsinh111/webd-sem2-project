# ============================================
# YatraMind — Application Configuration
# ============================================

spring:
  application:
    name: YatraMind

  # --- Database (H2 for dev, switch to PostgreSQL for production) ---
  # --- Database ---
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

  # --- Jackson ---
  jackson:
    default-property-inclusion: non_null

# --- Server ---
server:
  port: 8080
  servlet:
    context-path: /api

# --- JWT ---
app:
  jwt:
    secret: YatraMindSuperSecretKeyForJWTToken2026MakeItLongEnoughForHS512Algorithm!!
    access-token-expiration: 1800000    # 30 minutes
    refresh-token-expiration: 604800000  # 7 days
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# --- Logging ---
logging:
  level:
    com.yatramind: DEBUG
    org.springframework.security: INFO
